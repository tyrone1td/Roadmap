<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fdf1f5">
<title>RoadMap — Digital Forensics</title>
<style>
*,:before,:after{box-sizing:border-box}
:root{
 --bg:#fdf1f5;--bg2:#f6d3e0;--bg3:#fbe4ec;--glow-a:rgba(255,200,222,.55);--glow-b:rgba(255,180,205,.32);
 --text:#3d2b32;--sub:#7a6169;--panel-bg:rgba(255,248,250,.96);--border:rgba(61,43,50,.14);

 --card-1:#f6b8d2;--card-2:#ef94bb;--card-3:#e46fa0;--card-4:#d64f89;--card-5:#b23368;--card-6:#8c2350;--card-7:#611538;
 --card-icon:#fff;--card-outline:rgba(178,51,104,.35);--card-outline-hover:rgba(178,51,104,.65);
 --card-width:clamp(128px,42vw,180px);--card-height:clamp(180px,59vw,250px);--card-gap:clamp(18px,7vw,50px)
}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{user-select:none}
button,.card,.item{-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible,.card:focus-visible,.item:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}
.stage{position:relative;width:100vw;height:100vh;height:100dvh;min-height:0;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 16% 20%,var(--glow-a),transparent 46%),radial-gradient(circle at 84% 80%,var(--glow-b),transparent 52%),linear-gradient(160deg,var(--bg),var(--bg3) 55%,var(--bg2));transition:background .45s ease}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.top-left-group{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));z-index:100;display:flex;align-items:center;max-width:60vw}
.top-title{font-size:clamp(15px,2vw,18px);font-weight:650;letter-spacing:-.35px}
.theme-picker{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));z-index:100;display:flex;gap:7px;align-items:center}
.theme-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);margin-right:2px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--sw);cursor:pointer;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.2);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.swatch.active{border-color:var(--text);transform:scale(1.18);box-shadow:0 0 0 2px var(--panel-bg),0 0 8px rgba(0,0,0,.22)}
.top-controls{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:100;display:flex;align-items:center}
.reset-btn{min-height:40px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:var(--panel-bg);color:var(--text);font-size:10px;letter-spacing:.55px;font-weight:800;cursor:pointer;opacity:1;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .18s ease,background .2s ease,border-color .2s ease}
.reset-btn:hover{transform:translateY(-1px)}
.belt-wrapper{position:absolute;left:0;top:47%;width:100%;height:min(430px,54vh);transform:translateY(-50%);transition:transform .55s cubic-bezier(.16,1,.3,1),filter .55s ease;z-index:10}
.belt-wrapper.open{transform:translateY(-50%) scale(.94);filter:saturate(.85)}
.belt{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 46%;cursor:grab;touch-action:none;contain:layout paint}.belt.dragging{cursor:grabbing}
.card{--width:var(--card-width);--height:var(--card-height);position:absolute;left:50%;top:50%;width:var(--width);height:var(--height);margin-left:calc(var(--width)/-2);margin-top:calc(var(--height)/-2);overflow:hidden;border-radius:clamp(13px,3vw,16px);border:1.5px solid var(--card-outline);background:#222;box-shadow:none;transform-origin:center;cursor:pointer;will-change:transform,opacity,filter;contain:layout paint}
.card:hover{border-color:var(--card-outline-hover);box-shadow:none}
.card-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--card-icon);transition:transform .55s cubic-bezier(.16,1,.3,1),filter .3s ease}.card-art svg{width:clamp(36px,9vw,44px);height:clamp(36px,9vw,44px);opacity:.92;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}.card:hover .card-art{transform:scale(1.055)}
.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 24%,rgba(0,0,0,.2) 47%,rgba(0,0,0,.94) 100%);pointer-events:none}
.card-content{position:absolute;z-index:5;left:clamp(11px,3vw,16px);right:clamp(11px,3vw,16px);bottom:clamp(11px,3vw,16px)}
.card-year{margin-bottom:6px;font-size:clamp(8.5px,2.2vw,11px);letter-spacing:1.25px;color:rgba(255,255,255,.7);font-weight:650}.card-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,4.4vw,19px);line-height:1.13;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.art-1{background:var(--card-1)}.art-2{background:var(--card-2)}.art-3{background:var(--card-3)}.art-4{background:var(--card-4)}.art-5{background:var(--card-5)}.art-6{background:var(--card-6)}.art-7{background:var(--card-7)}
.lock-badge{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;color:#fff;background:rgba(10,8,10,.5);backdrop-filter:blur(2px);pointer-events:none}.card.locked .lock-badge{display:flex}.card.locked .card-art{filter:grayscale(1) brightness(.5)}
.journey-status{position:absolute;left:50%;top:max(18px,env(safe-area-inset-top));z-index:100;transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 12px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.18);color:var(--sub);font-size:10px;font-weight:750;letter-spacing:.45px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap;pointer-events:none}
.journey-dot{width:7px;height:7px;border-radius:50%;background:var(--tag-text);box-shadow:0 0 0 3px var(--tag-bg)}
.drag-hint{position:absolute;z-index:100;left:50%;bottom:max(58px,calc(env(safe-area-inset-bottom) + 52px));transform:translateX(-50%);font-size:8px;letter-spacing:3px;color:var(--sub);animation:slowFloat 3.2s ease-in-out infinite;pointer-events:none;white-space:nowrap}
@keyframes slowFloat{0%,100%{transform:translate(-50%,0);opacity:.48}50%{transform:translate(-50%,-6px);opacity:.95}}
.backdrop{position:fixed;inset:0;z-index:70;background:rgba(20,10,15,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .35s ease}.backdrop.open{opacity:1;pointer-events:auto}
.info-panel{position:fixed;z-index:90;top:50%;left:50%;width:min(1000px,94vw);max-height:84vh;background:var(--panel-bg);border:1px solid var(--border);border-radius:28px;box-shadow:0 50px 100px rgba(30,15,20,.35),inset 0 1px 0 rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translate(-50%,-48%) scale(.92);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.16,1,.3,1),opacity .35s ease,background .45s ease,border-color .45s ease;overflow:hidden}
.info-panel.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.close{position:absolute;top:20px;right:20px;width:38px;height:38px;z-index:20;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border);background:var(--btn-bg);color:var(--text);font-size:20px;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#panelContent{width:100%;max-height:84vh;padding:68px 56px 52px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}#panelContent::-webkit-scrollbar{display:none}
.panel-year{margin-bottom:16px;font-size:11px;letter-spacing:3.2px;color:var(--sub);font-weight:700;text-transform:uppercase}.panel-badge{display:inline-block;padding:6px 11px;margin-bottom:18px;border:1px solid var(--border);border-radius:999px;background:var(--btn-bg);color:var(--sub);font-size:10px;font-weight:750;letter-spacing:.45px}.panel-title{margin:0 0 16px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,5vw,44px);line-height:1.08;font-weight:400;overflow-wrap:anywhere}.panel-subtitle{margin-bottom:28px;font-size:16px;line-height:1.7;color:var(--sub)}
.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:30px}.progress-track{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden}.progress-fill{height:100%;background:var(--tag-text);border-radius:inherit;transition:width .3s ease}.progress-label{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:650}.panel-section{margin-bottom:34px}
.panel-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}.item{display:flex;align-items:flex-start;gap:14px;padding:13px 12px;border:1px solid transparent;border-radius:11px;cursor:pointer;transition:background .18s ease,border-color .18s ease}.item:hover{background:var(--btn-bg);border-color:var(--border)}
.check{flex:0 0 20px;width:20px;height:20px;margin-top:2px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1.5px solid var(--sub);transition:background .18s ease,border-color .18s ease}.item.checked .check{background:var(--tag-text);border-color:var(--tag-text)}.item.checked .check:after{content:"✓";color:#fff;font-size:12px;line-height:1}.item-text{font-size:15px;line-height:1.65;color:var(--text)}.item.checked .item-text{color:var(--sub);text-decoration:line-through;opacity:.78}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.choice-card{min-height:158px;padding:20px;text-align:left;background:var(--btn-bg);border:2px solid var(--border);border-radius:14px;cursor:pointer;transition:transform .2s ease,border-color .2s ease,background .2s ease}.choice-card:hover{border-color:var(--focus-ring);transform:translateY(-2px)}.choice-card.selected{border-color:var(--focus-ring);background:var(--tag-bg)}.choice-card h4,.postgrad-card h4{margin:0 0 8px;color:var(--text);font-family:Georgia,serif;font-size:16px}.choice-card p,.postgrad-card p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.5}
.path-note{margin:16px 0 0;padding:12px 14px;border-left:3px solid var(--focus-ring);border-radius:0 10px 10px 0;background:var(--btn-bg);color:var(--sub);font-size:13px;line-height:1.55}.path-note strong{color:var(--text)}
.postgrad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}.postgrad-card{padding:20px;border:1px solid var(--border);border-radius:14px;background:var(--btn-bg)}
.special-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.special-card,.career-card{padding:17px;border:1px solid var(--border);border-radius:13px;background:var(--btn-bg)}.special-card h4,.career-card h4{margin:0 0 6px;color:var(--text);font-family:Georgia,serif;font-size:15px}.special-card p,.career-card p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.55}
.career-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.locked-view{padding:50px 10px 20px;text-align:center}.locked-view .lock-icon{display:flex;justify-content:center;margin-bottom:22px;color:var(--sub)}.locked-view .lock-icon svg{width:44px;height:44px}.locked-view h2{margin:0 0 14px;font-family:Georgia,serif;font-weight:400;font-size:clamp(28px,5vw,34px)}.locked-view p{margin:0 auto 30px;max-width:560px;color:var(--sub);font-size:16px;line-height:1.7}.locked-view button{padding:13px 24px;border:1px solid var(--border);border-radius:12px;background:var(--btn-bg);color:var(--text);font-size:14px;font-weight:650;cursor:pointer}
.stage-action{margin-top:16px}.complete-btn{padding:14px 24px;border:0;border-radius:12px;background:var(--text);color:var(--panel-bg);font-size:14px;font-weight:750;cursor:pointer}.complete-btn:hover{opacity:.9}.complete-btn:disabled{opacity:.35;cursor:not-allowed}.completed-badge{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--tag-text)}
@media(max-width:900px){.choice-grid,.postgrad-grid,.career-grid{grid-template-columns:1fr}.special-grid{grid-template-columns:1fr}#panelContent{padding-left:34px;padding-right:34px}}
@media(max-width:700px){
 :root{--card-width:clamp(128px,42vw,150px);--card-height:clamp(180px,59vw,212px);--card-gap:clamp(18px,7vw,32px)}
 .top-left-group{top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left))}.theme-picker{top:max(12px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}.theme-label{display:none}.swatch{width:21px;height:21px}
 .belt-wrapper{top:47%;height:310px}.belt-wrapper.open{transform:translateY(-50%) scale(.985)}
 .top-controls{bottom:max(14px,env(safe-area-inset-bottom))}.journey-status{top:max(14px,env(safe-area-inset-top));font-size:9px;padding:6px 10px}.drag-hint{bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px))}
 .info-panel{inset:0;width:100%;max-height:none;height:100dvh;border-radius:0;transform:translateY(100%)}.info-panel.open{transform:translateY(0)}
 #panelContent{max-height:100dvh;height:100%;padding:max(74px,calc(env(safe-area-inset-top) + 62px)) max(18px,env(safe-area-inset-right)) max(28px,calc(env(safe-area-inset-bottom) + 22px)) max(18px,env(safe-area-inset-left))}
 .close{top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));width:40px;height:40px;background:var(--panel-bg)}.panel-title{font-size:clamp(30px,9vw,38px)}.panel-subtitle{font-size:15px;line-height:1.65}.item{padding:12px 9px;gap:12px}.item-text{font-size:14px;line-height:1.6}.choice-card,.postgrad-card{min-height:0;padding:17px}.complete-btn{width:100%;min-height:48px}
}
@media(max-width:370px){.card-content{left:11px;right:11px;bottom:11px}.card-title{font-size:15px}.card-year{font-size:8.5px;letter-spacing:1.1px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.drag-hint{animation:none}}
</style>

<body>
<div class="stage">
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="top-left-group"><div class="top-title">RoadMap</div></div>
<div class="top-controls"><button class="reset-btn" id="resetBtn" type="button">Reset Progress</button></div>
<div class="journey-status" id="journeyStatus"><span class="journey-dot"></span><span id="journeyStatusText">Milestone 01</span></div>
<div class="theme-picker" id="themePicker" role="radiogroup" aria-label="Theme selector"><span class="theme-label">Theme</span><button class="swatch" data-theme="white" style="--sw:#fff" type="button" role="radio" aria-checked="false" aria-label="White Theme"></button><button class="swatch" data-theme="black" style="--sw:#111" type="button" role="radio" aria-checked="false" aria-label="Black Theme"></button><button class="swatch" data-theme="pink" style="--sw:#e46fa0" type="button" role="radio" aria-checked="false" aria-label="Pink Theme"></button></div>
<div class="belt-wrapper" id="beltWrapper"><div class="belt" id="belt" role="region" aria-label="Roadmap stages slider"></div></div>
<div class="drag-hint">DRAG TO SCROLL</div>
<div class="backdrop" id="backdrop"></div>
<aside class="info-panel" id="infoPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><button class="close" id="closeButton" type="button" aria-label="Close details panel">×</button><div id="panelContent"></div></aside>
</div>
<script>
"use strict";
const safeStorage={get(k,f=null){try{return localStorage.getItem(k)??f}catch{return f}},set(k,v){try{localStorage.setItem(k,v)}catch{}},remove(k){try{localStorage.removeItem(k)}catch{}}};
function readJSON(k,f){try{const r=safeStorage.get(k);return r?JSON.parse(r):f}catch{return f}}
const prefersReducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas=document.getElementById("bgCanvas"),ctx=canvas.getContext("2d",{alpha:true});
let particles=[],canvasDpr=1,currentThemeName=safeStorage.get("roadmap-theme","pink");
function getParticleCount(){const area=innerWidth*innerHeight;return prefersReducedMotion?8:area<280000?18:area<700000?28:42}
function resizeCanvas(){canvasDpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.floor(innerWidth*canvasDpr);canvas.height=Math.floor(innerHeight*canvasDpr);ctx.setTransform(canvasDpr,0,0,canvasDpr,0,0);initParticles()}
function initParticles(){particles=Array.from({length:getParticleCount()},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*6+3,speedX:(Math.random()-.45)*.35,speedY:Math.random()*.55+.28,angle:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.03,wobble:Math.random()*Math.PI,wobbleSpeed:Math.random()*.035+.015,opacity:Math.random()*.35+.18}))}
function drawLeaf(x,y,size,angle,opacity,pink,dark){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size*.6);ctx.beginPath();ctx.moveTo(0,-1);ctx.bezierCurveTo(.8,-1.2,1.2,-.2,.7,.6);ctx.bezierCurveTo(.3,1.2,0,1.3,0,1);ctx.bezierCurveTo(0,1.3,-.3,1.2,-.7,.6);ctx.bezierCurveTo(-1.2,-.2,-.8,-1.2,0,-1);ctx.closePath();if(pink){ctx.fillStyle=`rgba(255,182,203,${opacity})`;ctx.strokeStyle=`rgba(230,110,150,${opacity*.7})`}else if(dark){ctx.fillStyle=`rgba(240,240,240,${opacity*.5})`;ctx.strokeStyle=`rgba(255,255,255,${opacity*.3})`}else{ctx.fillStyle=`rgba(130,130,130,${opacity*.35})`;ctx.strokeStyle=`rgba(80,80,80,${opacity*.3})`}ctx.lineWidth=.2;ctx.fill();ctx.stroke();ctx.restore()}
function drawParticles(){const w=innerWidth,h=innerHeight,pink=currentThemeName==='pink',dark=currentThemeName==='black';ctx.clearRect(0,0,w,h);particles.forEach(p=>{if(!prefersReducedMotion){p.wobble+=p.wobbleSpeed;p.x+=p.speedX+Math.sin(p.wobble)*.45;p.y+=p.speedY;p.angle+=p.spin;if(p.y>h+25){p.y=-25;p.x=Math.random()*w}if(p.x>w+25)p.x=-25;if(p.x<-25)p.x=w+25}drawLeaf(p.x,p.y,p.size,p.angle,p.opacity,pink,dark)})}
const themes={
 white:{bg:"#fff",bg3:"#f8f8f8",bg2:"#eee",glowA:"rgba(0,0,0,.035)",glowB:"rgba(0,0,0,.02)",text:"#141414",sub:"#6b6b6b",panel:"rgba(255,255,255,.95)",border:"rgba(0,0,0,.13)",tagBg:"rgba(0,0,0,.08)",tagText:"#141414",btn:"rgba(0,0,0,.045)",cards:["#f2f2f2","#e6e6e6","#d9d9d9","#ccc","#bfbfbf","#a8a8a8","#8f8f8f"],cardIcon:"#141414",cardOutline:"rgba(0,0,0,.22)",cardOutlineHover:"rgba(0,0,0,.45)",focusRing:"#141414"},
 black:{bg:"#141414",bg3:"#0d0d0d",bg2:"#000",glowA:"rgba(255,255,255,.06)",glowB:"rgba(255,255,255,.035)",text:"#f2f2f2",sub:"#9a9a9a",panel:"rgba(16,16,16,.95)",border:"rgba(255,255,255,.13)",tagBg:"rgba(255,255,255,.12)",tagText:"#f2f2f2",btn:"rgba(255,255,255,.05)",cards:["#565656","#4a4a4a","#3e3e3e","#333","#282828","#1d1d1d","#101010"],cardIcon:"#fff",cardOutline:"rgba(255,255,255,.2)",cardOutlineHover:"rgba(255,255,255,.45)",focusRing:"#f2f2f2"},
 pink:{bg:"#fdf1f5",bg3:"#fbe4ec",bg2:"#f6d3e0",glowA:"rgba(255,200,222,.55)",glowB:"rgba(255,180,205,.32)",text:"#3d2b32",sub:"#7a6169",panel:"rgba(255,248,250,.95)",border:"rgba(61,43,50,.14)",tagBg:"#f0c3d3",tagText:"#5b2e3c",btn:"rgba(61,43,50,.05)",cards:["#f6b8d2","#ef94bb","#e46fa0","#d64f89","#b23368","#8c2350","#611538"],cardIcon:"#fff",cardOutline:"rgba(178,51,104,.35)",cardOutlineHover:"rgba(178,51,104,.65)",focusRing:"#d64f89"}}
function applyTheme(name){currentThemeName=themes[name]?name:"pink";const t=themes[currentThemeName],r=document.documentElement.style;Object.entries({"--bg":t.bg,"--bg2":t.bg2,"--bg3":t.bg3,"--glow-a":t.glowA,"--glow-b":t.glowB,"--text":t.text,"--sub":t.sub,"--panel-bg":t.panel,"--border":t.border,"--tag-bg":t.tagBg,"--tag-text":t.tagText,"--btn-bg":t.btn,"--focus-ring":t.focusRing,"--card-icon":t.cardIcon,"--card-outline":t.cardOutline,"--card-outline-hover":t.cardOutlineHover}).forEach(([k,v])=>r.setProperty(k,v));t.cards.forEach((c,i)=>r.setProperty(`--card-${i+1}`,c));document.querySelectorAll(".swatch").forEach(b=>{const a=b.dataset.theme===currentThemeName;b.classList.toggle("active",a);b.setAttribute("aria-checked",a?"true":"false")});safeStorage.set("roadmap-theme",currentThemeName);drawParticles()}

const baseMilestones=[
 {year:"Milestone 01",title:"Current Position",artClass:"art-1",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,desc:"This is simply your starting point. Take a breath, look at where you are now, and focus on what actually matters at this stage. You do not need to have the whole journey figured out yet.",actions:["Know your starting point: note your degree, useful modules, mathematics background, and the technical skills you already have.","Set a healthy academic target: aim for strong results while giving yourself room to learn, adjust, and improve along the way.","Keep the facts clear: separate confirmed Wits requirements from routes you are still exploring so you can make decisions with confidence."]},
 {year:"Milestone 02",title:"Choose Your Direction",artClass:"art-2",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/></svg>`,desc:"Take it slow — you do not have to choose your entire future in one moment. Some routes may be more open than others, and that is okay. Pick the direction that feels right for you now, keep learning, and let your experience help shape the next decision.",isChoiceCard:true},
 {year:"Milestone 03",title:"Undergraduate Foundation",artClass:"art-3",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`,desc:"Build a foundation you can be proud of: strong academics, useful technical skills, and enough curiosity to keep exploring what suits you best.",isDynamic:true},
 {year:"Milestone 04",title:"Practical Experience",artClass:"art-4",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,desc:"This is where your confidence starts to become practical skill. You do not need a huge list of achievements — just steady experience that you can honestly call your own.",actions:["Start with hands-on labs: use beginner-friendly cybersecurity and digital-forensics platforms, then gradually take on harder investigations as your fundamentals improve.","Get comfortable with the core tools: practise Linux, networking, packet analysis, file-system concepts, logs, and basic evidence handling.","Keep a record of your progress: save notes, write short technical reports, and organise projects you would be happy to show someone.","Choose credentials thoughtfully: only add certifications when they support skills you are actually learning and using."]},
 {year:"Milestone 05",title:"Postgraduate Bridge",artClass:"art-5",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>`,desc:"When the time comes, slow down and compare your postgraduate options carefully. Look at the requirements, the kind of work you enjoy, and the direction you have built toward — then choose from there.",isPostgradMenu:true},
 {year:"Milestone 06",title:"Specialisation",artClass:"art-6",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,desc:"You do not need to pick a forever-specialisation. Explore a few areas, notice what genuinely interests you, and then go deeper where you feel most engaged.",isSpecialisation:true},

const belt=document.getElementById("belt"),beltWrapper=document.getElementById("beltWrapper"),infoPanel=document.getElementById("infoPanel"),panelContent=document.getElementById("panelContent"),closeButton=document.getElementById("closeButton"),backdrop=document.getElementById("backdrop"),journeyStatusText=document.getElementById("journeyStatusText");
let checks=readJSON("roadmap-checks",{}),completed=readJSON("roadmap-completed",[]),chosenPath=safeStorage.get("roadmap-chosen-path"),activeCard=null;
const CARD_COUNT=baseMilestones.length,CENTER=Math.floor(CARD_COUNT/2);

function renderSlider(){const step=getStep();cards.forEach((card,index)=>{let relative=index-position-CENTER;relative=wrapNumber(relative);const distance=Math.abs(relative),x=relative*step,y=-relative*13+distance*1.35,scale=.60+Math.max(0,1-distance/4.7)*.45,rotate=-7+relative*1.35,tilt=-11+relative*1.9,opacity=Math.max(0,1-Math.max(0,distance-2)*.31),blur=Math.max(0,distance-3.35)*1.45,z=Math.round(100-distance*10);card.style.transform=`translate3d(${x}px,${y}px,${Math.max(0,(4.5-distance)*82)}px) rotateZ(${rotate}deg) rotateY(${tilt}deg) scale(${scale})`;card.style.opacity=opacity;card.style.filter=`blur(${blur}px)`;card.style.zIndex=z})}
function saveChecks(){safeStorage.set("roadmap-checks",JSON.stringify(checks))}function saveCompleted(){safeStorage.set("roadmap-completed",JSON.stringify(completed))}function isUnlocked(i){return i===0||completed[i-1]===true}

function triggerCelebration(){const pop=document.createElement("div");pop.style.cssText="position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:20px";pop.innerHTML=`<div style="width:min(520px,92vw);background:var(--panel-bg);border:2px solid var(--border);padding:28px 24px;border-radius:20px;text-align:center;backdrop-filter:blur(20px)"><h2 style="margin:0 0 10px;font-family:Georgia,serif;font-size:28px;color:var(--text)">🎉 Roadmap Mastered!</h2><p style="margin:0;font-size:15px;line-height:1.6;color:var(--sub)">You have completed all roadmap milestones.</p></div>`;document.body.appendChild(pop);setTimeout(()=>pop.remove(),4000)}
function resetProgress(){if(!confirm("Are you sure you want to reset your roadmap progress?"))return;safeStorage.remove("roadmap-checks");safeStorage.remove("roadmap-completed");safeStorage.remove("roadmap-chosen-path");checks={};completed=[];chosenPath=null;refreshLocks();if(activeCard!==null)renderStage(activeCard)}
function renderChecklist(actions,index){let checkedCount=0;const html=actions.map((point,i)=>{const key=`action-${index}-${i}`,checked=Boolean(checks[key]);if(checked)checkedCount++;return `<li class="item ${checked?"checked":""}" data-key="${key}" tabindex="0" role="checkbox" aria-checked="${checked}"><span class="check" aria-hidden="true"></span><span class="item-text">${point}</span></li>`}).join("");return{html:`<ul class="panel-list">${html}</ul>`,checkedCount,total:actions.length}}
function renderStage(index){
 const base=baseMilestones[index],item={...base};let sections="",total=0,checkedCount=0;
 if(item.isChoiceCard){sections=`<div class="choice-grid"><button class="choice-card ${chosenPath==="bsc"?"selected":""}" type="button" data-path="bsc"><h4>Technical / Science</h4><p>Explore a more computing-focused route. Confirm the actual transfer and postgraduate requirements with Wits, then see how this direction fits your strengths and interests.</p></button><button class="choice-card ${chosenPath==="ba"?"selected":""}" type="button" data-path="ba"><h4>Interdisciplinary BA</h4><p>Build from Digital Arts while adding programming, technical projects, labs, and a portfolio that shows what you can actually do.</p></button><button class="choice-card ${chosenPath==="com"?"selected":""}" type="button" data-path="com"><h4>Corporate / Governance</h4><p>Build toward cyber investigations, governance, risk, compliance, clear communication, and security-management work.</p></button></div><div class="path-note"><strong>Keep in mind:</strong> this is a direction, not a permanent label. You are allowed to learn, change your mind, and grow as you go.</div>`}
 if(item.isDynamic){
   const path=chosenPath;
   if(!path){sections=`<div class="locked-view" style="padding-top:10px"><div class="panel-badge">CHOOSE YOUR DIRECTION FIRST</div><p style="margin:0;color:var(--sub);line-height:1.7">No pressure — go back to Milestone 02, choose the direction that makes the most sense right now, and this stage will build around it.</p></div>`}
   else {
     const configs={
       bsc:{title:"Technical Foundation",desc:"Give yourself a strong technical base and let your interest grow naturally. You do not need to know everything yet — just keep building, one skill at a time.",actions:["Prioritise programming, computing, systems, networking, and mathematics where these are part of your approved programme.","Build small technical projects that let you practise problem-solving, debugging, data handling, and systems thinking.","Protect your academic record and check programme or transfer requirements with the university whenever a decision matters."]},
       ba:{title:"Interdisciplinary Foundation",desc:"Let your Digital Arts background work for you. Keep the creative side, while steadily adding technical depth that opens more doors later.",actions:["Take programming and technically demanding modules seriously, and give yourself time to become genuinely comfortable with them.","Build a technical portfolio with code, interactive projects, documentation, and a few projects you are genuinely proud to show.","Add useful computing fundamentals independently: Linux, networking, data structures, version control, and security basics."]},
       com:{title:"Corporate Foundation",desc:"Build a broad cyber foundation while leaning into the skills that make you valuable in real organisations: communication, investigation, judgement, and clear thinking.",actions:["Learn security fundamentals across networks, operating systems, incidents, identity, and digital evidence.","Build governance and risk knowledge around privacy, controls, compliance, reporting, and responsible handling of information.","Practise explaining technical findings clearly through short reports, presentations, dashboards, and simple case studies."]}
     };
     item.title=configs[path].title;item.desc=configs[path].desc;const c=renderChecklist(configs[path].actions,index);sections=c.html;total=c.total;checkedCount=c.checkedCount;
   }
 }
 if(item.actions&&!item.isDynamic){const c=renderChecklist(item.actions,index);sections=c.html;total=c.total;checkedCount=c.checkedCount}
 if(item.isPostgradMenu){
   let note="Take the time to compare confirmed entry requirements with your academic background and the kind of cybersecurity work you can genuinely see yourself enjoying.";

   if(chosenPath==="com")note="This direction naturally brings together cyber fundamentals with governance, investigations, risk, communication, and organisational security.";
   sections=`<div class="postgrad-grid"><div class="postgrad-card"><h4>Technical / Research Route</h4><p>Look for postgraduate study that deepens computing, cybersecurity, networks, systems, digital investigation, or research skills.</p></div><div class="postgrad-card"><h4>Interdisciplinary / Alternative Entry</h4><p>Where available, investigate routes that consider a non-traditional undergraduate background through prerequisites, prior learning, and demonstrable technical capability.</p></div><div class="postgrad-card"><h4>Management / Governance Route</h4><p>Explore postgraduate study centred on cybersecurity management, governance, risk, compliance, investigations, and organisational security.</p></div></div><div class="path-note"><strong>Your checkpoint:</strong> ${note}</div>`;
 }
 if(item.isSpecialisation){

 }
 if(item.isCareer){
   sections=`<div class="career-grid"><div class="career-card"><h4>Digital Forensics</h4><p>Investigate devices, files, accounts, timelines, and other forms of digital evidence.</p></div><div class="career-card"><h4>Incident Response</h4><p>Help organisations investigate incidents, respond thoughtfully, and learn from what happened.</p></div><div class="career-card"><h4>Corporate Investigations</h4><p>Support internal investigations, evidence review, digital findings, and clear reporting.</p></div><div class="career-card"><h4>Security Consulting</h4><p>Work on security investigations, controls, risk, or specialist advisory projects with different organisations.</p></div><div class="career-card"><h4>Governance & Risk</h4><p>Focus on cyber policy, privacy, compliance, risk management, and organisational security.</p></div><div class="career-card"><h4>Research / Further Study</h4><p>Continue into advanced study, specialist research, teaching, or a cybersecurity area you want to understand deeply.</p></div></div><div class="path-note"><strong>Keep the bigger picture:</strong> you do not need to have the whole career mapped out on day one. Keep learning, keep growing, and let each experience teach you what comes next.</div>`;
 }
 const pct=total?Math.round(checkedCount/total*100):0,isDone=completed[index]===true,isLast=index===baseMilestones.length-1,allChecked=item.isChoiceCard?chosenPath!==null:item.isDynamic&&!chosenPath?false:(total===0||checkedCount===total);
 panelContent.innerHTML=`<div class="panel-year">${item.year}</div><div class="panel-badge">STAGE ${index+1} OF ${baseMilestones.length}</div><h1 class="panel-title" id="panelTitle">${item.title}</h1><div class="panel-subtitle">${item.desc}</div>${total?`<div class="progress-row"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="progress-label">${checkedCount}/${total} checked</div></div>`:""}<div class="panel-section">${sections}</div><div class="stage-action">${isDone?`<span class="completed-badge">✓ You’ve completed this milestone</span>`:`<button class="complete-btn" id="completeBtn" type="button" ${allChecked?"":"disabled"}>${allChecked?(isLast?"Finish this milestone":"Finish & unlock next →"):(item.isChoiceCard?"Pick a direction above to continue":"Check off each step to unlock")}</button>`}</div>`;
 panelContent.querySelectorAll(".choice-card").forEach(b=>b.addEventListener("click",()=>{chosenPath=b.dataset.path;safeStorage.set("roadmap-chosen-path",chosenPath);renderStage(index)}));
 panelContent.querySelectorAll(".item").forEach(el=>{const toggle=()=>{const key=el.dataset.key;checks[key]=!checks[key];saveChecks();renderStage(index)};el.addEventListener("click",toggle);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}})});
 const btn=document.getElementById("completeBtn");if(btn)btn.addEventListener("click",()=>{completed[index]=true;saveCompleted();refreshLocks();closePanel();if(isLast)triggerCelebration();else target+=1;normalizeWorldState()});
}
function openCard(index){if(activeCard===index)return;activeCard=index;if(!isUnlocked(index)){const prev=baseMilestones[index-1];panelContent.innerHTML=`<div class="locked-view"><div class="lock-icon">${LOCK_SVG}</div><h2>${baseMilestones[index].title} is locked</h2><p>Finish “${prev.title}” first, then this next part will open up for you.</p><button id="jumpPrev" type="button">View “${prev.title}”</button></div>`;document.getElementById("jumpPrev").addEventListener("click",()=>{activeCard=null;openCard(index-1)})}else renderStage(index);panelContent.scrollTop=0;beltWrapper.classList.add("open");backdrop.classList.add("open");infoPanel.classList.add("open");requestAnimationFrame(()=>closeButton.focus())}

belt.addEventListener("pointerdown",e=>{if(activeCard!==null)return;dragging=true;moved=false;startX=lastX=e.clientX;velocity=0;belt.classList.add("dragging");try{belt.setPointerCapture(e.pointerId)}catch{}});

belt.addEventListener("pointerup",endDrag);belt.addEventListener("pointercancel",endDrag);

if(prefersReducedMotion)drawParticles();else requestAnimationFrame(function particleLoop(){if(!document.hidden)drawParticles();requestAnimationFrame(particleLoop)});requestAnimationFrame(animate);
