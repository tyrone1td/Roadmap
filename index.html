<style>

.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 24%,rgba(0,0,0,.2) 47%,rgba(0,0,0,.94) 100%);pointer-events:none}

.art-1{background:var(--card-1)}.art-2{background:var(--card-2)}.art-3{background:var(--card-3)}.art-4{background:var(--card-4)}.art-5{background:var(--card-5)}.art-6{background:var(--card-6)}.art-7{background:var(--card-7)}

.panel-year{margin-bottom:16px;font-size:11px;letter-spacing:3.2px;color:var(--sub);font-weight:700;text-transform:uppercase}.panel-badge{display:inline-block;padding:6px 11px;margin-bottom:18px;border:1px solid var(--border);border-radius:999px;background:var(--btn-bg);color:var(--sub);font-size:10px;font-weight:750;letter-spacing:.45px}.panel-title{margin:0 0 16px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,5vw,44px);line-height:1.08;font-weight:400;overflow-wrap:anywhere}.panel-subtitle{margin-bottom:28px;font-size:16px;line-height:1.7;color:var(--sub)}
.progress-row{display:flex;align-items:center;gap:14px;margin-bottom:30px}.progress-track{flex:1;height:6px;border-radius:999px;background:var(--border);overflow:hidden}.progress-fill{height:100%;background:var(--tag-text);border-radius:inherit;transition:width .3s ease}.progress-label{font-size:12px;color:var(--sub);white-space:nowrap;font-weight:650}.panel-section{margin-bottom:34px}

.career-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.locked-view{padding:50px 10px 20px;text-align:center}.locked-view .lock-icon{display:flex;justify-content:center;margin-bottom:22px;color:var(--sub)}.locked-view .lock-icon svg{width:44px;height:44px}.locked-view h2{margin:0 0 14px;font-family:Georgia,serif;font-weight:400;font-size:clamp(28px,5vw,34px)}.locked-view p{margin:0 auto 30px;max-width:560px;color:var(--sub);font-size:16px;line-height:1.7}.locked-view button{padding:13px 24px;border:1px solid var(--border);border-radius:12px;background:var(--btn-bg);color:var(--text);font-size:14px;font-weight:650;cursor:pointer}
.stage-action{margin-top:16px}.complete-btn{padding:14px 24px;border:0;border-radius:12px;background:var(--text);color:var(--panel-bg);font-size:14px;font-weight:750;cursor:pointer}.complete-btn:hover{opacity:.9}.complete-btn:disabled{opacity:.35;cursor:not-allowed}.completed-badge{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--tag-text)}
.link-head{margin:26px 0 12px;font:650 15px Georgia,serif}.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.link-card{display:block;padding:16px;border:1px solid var(--border);border-radius:13px;background:var(--btn-bg);color:inherit;text-decoration:none;transition:border-color .2s}.link-card:hover{border-color:var(--focus-ring)}.link-card:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}.link-card h4{margin:0 0 6px;font-family:Georgia,serif;font-size:15px}.link-card p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.55}

.intro-img:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(45,15,28,.6))}
.intro.suck .intro-img{transform:scale(1.14);filter:blur(4px) brightness(1.05)}

.intro-copy{color:#fff;text-shadow:0 2px 14px rgba(40,10,25,.55)}.intro-title{color:#fff}.intro-pct{color:rgba(255,255,255,.88)}.intro-go{background:#fff;color:#3d2b32;border-color:transparent}
.intro-go:focus-visible{outline:2px solid var(--focus-ring);outline-offset:3px}

<body>
<div class="intro" id="intro" role="dialog" aria-label="Loading"><div class="intro-img" aria-hidden="true"></div><canvas id="introCv" aria-hidden="true"></canvas><div class="intro-copy"><div class="intro-title">RoadMap</div><div class="intro-pct" id="introPct">0%</div><button class="intro-go" id="introGo" type="button" disabled>Enter</button></div></div>
<div class="stage">
<canvas id="bgCanvas" aria-hidden="true"></canvas>
<div class="top-left-group"><div class="top-title">RoadMap</div></div>
<div class="top-controls"><button class="reset-btn" id="folioBtn" type="button">My portfolio</button><button class="reset-btn" id="resetBtn" type="button">Reset Progress</button></div>
<div class="journey-status" id="journeyStatus"><span class="journey-dot"></span><span id="journeyStatusText">Milestone 01</span></div>
<div class="theme-picker" id="themePicker" role="radiogroup" aria-label="Theme selector"><span class="theme-label">Theme</span><button class="swatch" data-theme="white" style="--sw:#fff" type="button" role="radio" aria-checked="false" aria-label="White Theme"></button><button class="swatch" data-theme="black" style="--sw:#111" type="button" role="radio" aria-checked="false" aria-label="Black Theme"></button><button class="swatch" data-theme="pink" style="--sw:#e46fa0" type="button" role="radio" aria-checked="false" aria-label="Pink Theme"></button></div>
<div class="belt-wrapper" id="beltWrapper"><div class="belt" id="belt" role="region" aria-label="Roadmap stages slider"></div></div>
<div class="drag-hint">Drag, scroll or use arrow keys</div>
<div class="backdrop" id="backdrop"></div>
<aside class="info-panel" id="infoPanel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><button class="close" id="closeButton" type="button" aria-label="Close details panel">×</button><div id="panelContent"></div></aside>
</div>
<script>
"use strict";
const safeStorage={get(k,f=null){try{return localStorage.getItem(k)??f}catch{return f}},set(k,v){try{localStorage.setItem(k,v)}catch{}},remove(k){try{localStorage.removeItem(k)}catch{}}};
function readJSON(k,f){try{const r=safeStorage.get(k);return r?JSON.parse(r):f}catch{return f}}
const prefersReducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas=document.getElementById("bgCanvas"),ctx=canvas.getContext("2d",{alpha:true});
let particles=[],canvasDpr=1,currentThemeName=safeStorage.get("roadmap-theme","pink");
function getParticleCount(){const area=innerWidth*innerHeight;return prefersReducedMotion?8:area<280000?18:area<700000?28:42}
function resizeCanvas(){canvasDpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.floor(innerWidth*canvasDpr);canvas.height=Math.floor(innerHeight*canvasDpr);ctx.setTransform(canvasDpr,0,0,canvasDpr,0,0);initParticles()}
function initParticles(){particles=Array.from({length:getParticleCount()},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,size:Math.random()*6+3,speedX:(Math.random()-.45)*.35,speedY:Math.random()*.55+.28,angle:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.03,wobble:Math.random()*Math.PI,wobbleSpeed:Math.random()*.035+.015,opacity:Math.random()*.35+.18}))}
function drawLeaf(x,y,size,angle,opacity,pink,dark){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size*.6);ctx.beginPath();ctx.moveTo(0,-1);ctx.bezierCurveTo(.8,-1.2,1.2,-.2,.7,.6);ctx.bezierCurveTo(.3,1.2,0,1.3,0,1);ctx.bezierCurveTo(0,1.3,-.3,1.2,-.7,.6);ctx.bezierCurveTo(-1.2,-.2,-.8,-1.2,0,-1);ctx.closePath();if(pink){ctx.fillStyle=`rgba(255,182,203,${opacity})`;ctx.strokeStyle=`rgba(230,110,150,${opacity*.7})`}else if(dark){ctx.fillStyle=`rgba(240,240,240,${opacity*.5})`;ctx.strokeStyle=`rgba(255,255,255,${opacity*.3})`}else{ctx.fillStyle=`rgba(130,130,130,${opacity*.35})`;ctx.strokeStyle=`rgba(80,80,80,${opacity*.3})`}ctx.lineWidth=.2;ctx.fill();ctx.stroke();ctx.restore()}
function drawParticles(){const w=innerWidth,h=innerHeight,pink=currentThemeName==='pink',dark=currentThemeName==='black';ctx.clearRect(0,0,w,h);particles.forEach(p=>{if(!prefersReducedMotion){p.wobble+=p.wobbleSpeed;p.x+=p.speedX+Math.sin(p.wobble)*.45;p.y+=p.speedY;p.angle+=p.spin;if(p.y>h+25){p.y=-25;p.x=Math.random()*w}if(p.x>w+25)p.x=-25;if(p.x<-25)p.x=w+25}drawLeaf(p.x,p.y,p.size,p.angle,p.opacity,pink,dark)})}
const themes={
 white:{bg:"#fff",bg3:"#f8f8f8",bg2:"#eee",glowA:"rgba(0,0,0,.035)",glowB:"rgba(0,0,0,.02)",text:"#141414",sub:"#6b6b6b",panel:"rgba(255,255,255,.95)",border:"rgba(0,0,0,.13)",tagBg:"rgba(0,0,0,.08)",tagText:"#141414",btn:"rgba(0,0,0,.045)",cards:["#f2f2f2","#e6e6e6","#d9d9d9","#ccc","#bfbfbf","#a8a8a8","#8f8f8f"],cardIcon:"#141414",cardOutline:"rgba(0,0,0,.22)",cardOutlineHover:"rgba(0,0,0,.45)",focusRing:"#141414"},
 black:{bg:"#141414",bg3:"#0d0d0d",bg2:"#000",glowA:"rgba(255,255,255,.06)",glowB:"rgba(255,255,255,.035)",text:"#f2f2f2",sub:"#9a9a9a",panel:"rgba(16,16,16,.95)",border:"rgba(255,255,255,.13)",tagBg:"rgba(255,255,255,.12)",tagText:"#f2f2f2",btn:"rgba(255,255,255,.05)",cards:["#565656","#4a4a4a","#3e3e3e","#333","#282828","#1d1d1d","#101010"],cardIcon:"#fff",cardOutline:"rgba(255,255,255,.2)",cardOutlineHover:"rgba(255,255,255,.45)",focusRing:"#f2f2f2"},
 pink:{bg:"#fdf1f5",bg3:"#fbe4ec",bg2:"#f6d3e0",glowA:"rgba(255,200,222,.55)",glowB:"rgba(255,180,205,.32)",text:"#3d2b32",sub:"#7a6169",panel:"rgba(255,248,250,.95)",border:"rgba(61,43,50,.14)",tagBg:"#f0c3d3",tagText:"#5b2e3c",btn:"rgba(61,43,50,.05)",cards:["#f6b8d2","#ef94bb","#e46fa0","#d64f89","#b23368","#8c2350","#611538"],cardIcon:"#fff",cardOutline:"rgba(178,51,104,.35)",cardOutlineHover:"rgba(178,51,104,.65)",focusRing:"#d64f89"}}
function applyTheme(name){currentThemeName=themes[name]?name:"pink";const t=themes[currentThemeName],r=document.documentElement.style;Object.entries({"--bg":t.bg,"--bg2":t.bg2,"--bg3":t.bg3,"--glow-a":t.glowA,"--glow-b":t.glowB,"--text":t.text,"--sub":t.sub,"--panel-bg":t.panel,"--border":t.border,"--tag-bg":t.tagBg,"--tag-text":t.tagText,"--btn-bg":t.btn,"--focus-ring":t.focusRing,"--card-icon":t.cardIcon,"--card-outline":t.cardOutline,"--card-outline-hover":t.cardOutlineHover}).forEach(([k,v])=>r.setProperty(k,v));t.cards.forEach((c,i)=>r.setProperty(`--card-${i+1}`,c));document.querySelectorAll(".swatch").forEach(b=>{const a=b.dataset.theme===currentThemeName;b.classList.toggle("active",a);b.setAttribute("aria-checked",a?"true":"false")});safeStorage.set("roadmap-theme",currentThemeName);drawParticles()}

const baseMilestones=[
 {year:"Milestone 01",title:"Current Position",artClass:"art-1",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,desc:"This is simply your starting point. Take a breath, look at where you are now, and focus on what actually matters at this stage. You do not need to have the whole journey figured out yet.",actions:["Know your starting point: note your degree, useful modules, mathematics background, and the technical skills you already have.","Set a healthy academic target: aim for strong results while giving yourself room to learn, adjust, and improve along the way.","Keep the facts clear: separate confirmed Wits requirements from routes you are still exploring so you can make decisions with confidence."]},
 {year:"Milestone 02",title:"Choose Your Direction",artClass:"art-2",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/></svg>`,desc:"Take it slow — you do not have to choose your entire future in one moment. Some routes may be more open than others, and that is okay. Pick the direction that feels right for you now, keep learning, and let your experience help shape the next decision.",isChoiceCard:true},
 {year:"Milestone 03",title:"Undergraduate Foundation",artClass:"art-3",icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/></svg>`,desc:"Build a foundation you can be proud of: strong academics, useful technical skills, and enough curiosity to keep exploring what suits you best.",isDynamic:true},

 panelContent.querySelectorAll("[data-idea]").forEach(b=>b.addEventListener("click",()=>{const d=IDEAS[+b.dataset.idea];folio.projects.push({title:d[0],year:String(new Date().getFullYear()),role:d[1],tools:d[2],summary:d[3],outcome:"",link:"",images:[]});saveFolio();renderPortfolio()}));
 panelContent.querySelectorAll("[data-addimg]").forEach(el=>el.addEventListener("change",()=>Promise.all([...el.files].map(shrink)).then(r=>{const p=folio.projects[+el.dataset.addimg],old=imgs(p);p.images=old.concat(r.filter(Boolean));if(!saveFolio())p.images=old;renderPortfolio()})));
 document.getElementById("addProj").addEventListener("click",()=>{const v=k=>document.getElementById("f-"+k).value.trim(),t=v("title");if(!t){document.getElementById("f-title").focus();return}Promise.all([...document.getElementById("f-imgs").files].map(shrink)).then(r=>{folio.projects.push({title:t,year:v("year"),role:v("role"),tools:v("tools"),summary:v("summary"),outcome:v("outcome"),link:v("link"),images:r.filter(Boolean)});if(!saveFolio())folio.projects.pop();renderPortfolio()})})}
function exportFolio(){const ps=folio.projects.map(p=>`<article><h2>${esc(p.title)}</h2><p class="m">${meta(p)}</p>${imgs(p).map(u=>`<img src="${u}" alt="">`).join("")}<p>${esc(p.summary)}</p>${p.outcome?`<p><b>Outcome:</b> ${esc(p.outcome)}</p>`:""}${okUrl(p.link)?`<p><a href="${esc(p.link)}">View project</a></p>`:""}</article>`).join("");
 const h=`<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(folio.name)||"Portfolio"}</title><style>body{font:17px/1.6 Georgia,serif;max-width:720px;margin:0 auto;padding:48px 20px;background:#fdf1f5;color:#3d2b32}article{border-top:1px solid #0002;padding:24px 0}img{display:block;max-width:100%;border-radius:10px;margin:0 0 10px}.m{color:#7a6169;font:14px system-ui}a{color:#b23368}</style><h1>${esc(folio.name)||"My portfolio"}</h1><p>${esc(folio.tagline)}</p>${ps}</html>`;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([h],{type:"text/html"}));a.download="portfolio.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openPortfolio(){activeCard="folio";fv="gallery";fo=null;renderPortfolio();panelContent.scrollTop=0;beltWrapper.classList.add("open");backdrop.classList.add("open");infoPanel.classList.add("open");stage.classList.add("modal-open");requestAnimationFrame(()=>closeButton.focus())}
document.getElementById("folioBtn").addEventListener("click",()=>{if(activeCard===null)openPortfolio()});
function openCard(index){if(activeCard===index)return;activeCard=index;if(!isUnlocked(index)){const prev=baseMilestones[index-1];panelContent.innerHTML=`<div class="locked-view"><div class="lock-icon">${LOCK_SVG}</div><h2>${baseMilestones[index].title} is locked</h2><p>Finish “${prev.title}” first, then this next part will open up for you.</p><button id="jumpPrev" type="button">View “${prev.title}”</button></div>`;document.getElementById("jumpPrev").addEventListener("click",()=>{activeCard=null;openCard(index-1)})}else renderStage(index);panelContent.scrollTop=0;beltWrapper.classList.add("open");backdrop.classList.add("open");infoPanel.classList.add("open");stage.classList.add("modal-open");document.documentElement.style.overflow="hidden";document.body.style.overflow="hidden";requestAnimationFrame(()=>closeButton.focus())}
function closePanel(){activeCard=null;infoPanel.classList.remove("open");backdrop.classList.remove("open");beltWrapper.classList.remove("open");stage.classList.remove("modal-open");document.documentElement.style.overflow="hidden";document.body.style.overflow="hidden"}
document.getElementById("themePicker").addEventListener("click",e=>{const b=e.target.closest(".swatch");if(b)applyTheme(b.dataset.theme)});document.getElementById("resetBtn").addEventListener("click",resetProgress);closeButton.addEventListener("click",closePanel);backdrop.addEventListener("click",closePanel);
belt.addEventListener("pointerdown",e=>{if(activeCard!==null)return;dragging=true;moved=false;startX=lastX=e.clientX;velocity=0;belt.classList.add("dragging");try{belt.setPointerCapture(e.pointerId)}catch{}});
belt.addEventListener("pointermove",e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;if(Math.abs(e.clientX-startX)>5)moved=true;const amount=dx/getStep();target-=amount;velocity=amount});
function endDrag(e){if(!dragging)return;dragging=false;belt.classList.remove("dragging");try{belt.releasePointerCapture(e.pointerId)}catch{}if(!moved&&e.type==="pointerup"){const el=document.elementFromPoint(e.clientX,e.clientY),card=el?.closest?.(".card");if(card)openCard(Number(card.dataset.index));velocity=0;return}target-=velocity*2.6;normalizeWorldState()}
belt.addEventListener("pointerup",endDrag);belt.addEventListener("pointercancel",endDrag);
window.addEventListener("wheel",e=>{if(activeCard!==null)return;const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(delta)<1)return;e.preventDefault();target+=delta/(getStep()*2.5);normalizeWorldState()},{passive:false});
window.addEventListener("keydown",e=>{if(activeCard!==null){if(e.key==="Escape"){e.preventDefault();closePanel()}return}if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();target+=1}if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();target-=1}if(e.key==="Home"){e.preventDefault();target=-CENTER}if(e.key==="End"){e.preventDefault();target=CARD_COUNT-1-CENTER}});
addEventListener("resize",resizeCanvas,{passive:true});document.addEventListener("visibilitychange",()=>{if(!document.hidden){renderSlider();drawParticles()}});
applyTheme(currentThemeName);refreshLocks();resizeCanvas();renderSlider();
function animate(){if(!dragging){position+=(target-position)*.15;if(Math.abs(target-position)<.00045)position=target;normalizeWorldState()}renderSlider();updateTopProgress();requestAnimationFrame(animate)}
if(prefersReducedMotion)drawParticles();else requestAnimationFrame(function particleLoop(){if(!document.hidden)drawParticles();requestAnimationFrame(particleLoop)});requestAnimationFrame(animate);
(function(){
const el=document.getElementById("intro"),cv=document.getElementById("introCv"),cx=cv.getContext("2d"),pct=document.getElementById("introPct"),go=document.getElementById("introGo"),st=document.querySelector(".stage"),RM=prefersReducedMotion,rnd=Math.random;st.inert=true;
let w,h,dpr;const size=()=>{dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener("resize",size);
const COLS=["#ffe3ec","#ffd0df","#ffc0d3","#fff4f8"],N=w<700?55:95,K=Math.max(w,h)/1000,cl=x=>Math.max(0,Math.min(1,x)),P=[];
const mk=(i,x,y)=>({x:x??rnd()*w,y:y??rnd()*h,s:(7+rnd()*9)*(w<700?.8:1),r:rnd()*6.28,vr:(rnd()-.5)*1.6,f:rnd()*6.28,vf:1+rnd()*2,vx:45+rnd()*70,vy:22+rnd()*45,sw:rnd()*6.28,c:COLS[rnd()*4|0],th:i/N*.7});
for(let i=0;i<N;i++)P.push(mk(i));
function petal(q,a,k){const s=q.s*k;cx.save();cx.translate(q.x,q.y);cx.rotate(q.r);cx.scale(1,.35+.65*Math.abs(Math.cos(q.f)));cx.globalAlpha=a;cx.fillStyle=q.c;cx.beginPath();cx.moveTo(0,-s);cx.bezierCurveTo(s*.9,-s*.7,s*.8,s*.5,0,s*.8);cx.bezierCurveTo(-s*.8,s*.5,-s*.9,-s*.7,0,-s);cx.fill();cx.restore()}
function glow(a,rad){if(a<=.01)return;const g=cx.createRadialGradient(w/2,h/2,0,w/2,h/2,rad);g.addColorStop(0,`rgba(255,240,246,${a})`);g.addColorStop(1,"rgba(255,240,246,0)");cx.globalAlpha=1;cx.fillStyle=g;cx.fillRect(0,0,w,h)}
const BURST=2600;let t0=null,last=0,mode="load",tm=0,p=0;
function frame(t){if(t0===null){t0=t;last=t}const dt=Math.min(.05,(t-last)/1000);last=t;cx.clearRect(0,0,w,h);
 if(mode==="burst"&&t-tm>=BURST){el.remove();return}
 const m=t-tm,u=cl(m/BURST);
 if(mode==="load"){p=Math.min(1,(t-t0)/(RM?1:3200));pct.textContent=Math.round(p*100)+"%";if(p>=1&&go.disabled){go.disabled=false;go.focus()}}
 P.forEach(q=>{let a=.9,k=1;q.r+=q.vr*dt;q.f+=q.vf*dt;
  if(mode==="load"){if(!RM){q.sw+=dt;q.x+=(q.vx+Math.sin(q.sw)*25)*dt;q.y+=(q.vy+Math.cos(q.sw*.8)*15)*dt;if(q.x>w+20)q.x=-20;if(q.y>h+20)q.y=-20}a=cl((p-q.th)*6)*.9}
  else{const d=Math.exp(-1.5*dt);q.x+=q.bx*dt+20*dt;q.y+=q.by*dt;q.bx*=d;q.by*=d;q.r+=dt*3;k=.5+.9*cl(u*3);a=.95*(1-cl((u-.35)/.65))}
  if(a>.01)petal(q,a,k)});
 if(mode==="burst")glow(.9*(1-cl(m/900)),(160+m*.9)*K);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function boom(){mode="burst";tm=performance.now();el.classList.add("blow","burst");P.forEach(q=>{const dx=q.x-w/2,dy=q.y-h/2,d=Math.hypot(dx,dy)||1,sp=(250+rnd()*800)*K;q.bx=dx/d*sp;q.by=dy/d*sp});for(let i=0;i<90;i++){const q=mk(0,w/2,h/2),a=rnd()*6.28,sp=(200+rnd()*900)*K;q.bx=Math.cos(a)*sp;q.by=Math.sin(a)*sp;P.push(q)}}
go.addEventListener("click",()=>{st.inert=false;if(RM){el.classList.add("blow","burst");setTimeout(()=>el.remove(),50);return}
 boom()})})();
</script>
